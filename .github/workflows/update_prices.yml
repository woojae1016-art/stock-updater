name: 주가 자동 업데이트

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron-trigger]

permissions:
  contents: write   # keepalive 커밋용

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install yfinance requests python-dotenv

      - name: 주가 업데이트 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python update_stock_prices.py

      # GitHub는 public 리포에 60일간 커밋이 없으면 schedule 워크플로를 자동 비활성화함.
      # 마지막 커밋이 30일 이상 지났으면 빈 커밋을 하나 넣어 "활동"을 유지한다.
      - name: Keepalive (60일 자동 비활성화 방지)
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "마지막 커밋 이후 ${DAYS}일 경과"
          if [ "$DAYS" -ge 30 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (schedule 비활성화 방지)"
            git push
          fi
